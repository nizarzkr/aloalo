# CI : barrière qualité avant tout merge / déploiement Vercel.
# Tourne sur chaque push et chaque pull request. Aucun secret requis :
# lint, typecheck et build n'appellent aucune API externe.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # Pas de script "typecheck" dans package.json ; tsconfig a déjà noEmit:true.
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
